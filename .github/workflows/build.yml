name: build

# Every push to main cuts a release. That is deliberate: the app is downloaded
# rather than installed from a store, and a download needs a plain public URL
# to a file - a workflow artifact can only be fetched by a logged-in browser.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so every job builds the same SDL, and so a release upstream cannot
  # change what a tag of this repo produces.
  SDL_TAG: release-3.4.14

jobs:
  # ---------------------------------------------------------------- version
  # One place decides what this build is called. The patch number is the run
  # number, so every push to main is strictly newer than the last - which is
  # what the in-app updater compares to decide whether to offer one.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          BASE=$(head -1 VERSION | tr -d '[:space:]')

          echo "version=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "building ${BASE}.${GITHUB_RUN_NUMBER}"

  # ------------------------------------------------------------------ checks
  # Runs in about a minute and catches the ordinary mistakes. The DSP part is
  # the interesting one: it renders the real engine and measures the result, so
  # a change that makes the synthesizer clip, produce a NaN or fall silent
  # fails here rather than in someone's headphones.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libgl1-mesa-dev \
            libegl1-mesa-dev libgles2-mesa-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libibus-1.0-dev libdecor-0-dev libsndio-dev

      - name: Unit tests
        run: |
          set -euo pipefail
          cmake -S host -B build/checks -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/checks
          ctest --test-dir build/checks --output-on-failure

      - name: Warnings are errors on our own code
        run: |
          set -euo pipefail
          cmake -S host -B build/warn -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra"
          cmake --build build/warn 2>&1 | tee warn.log
          # SDL and miniaudio are not ours to keep warning-free.
          if grep -E "^/home/runner/work/[^ ]*/host/[^ ]*warning" warn.log; then
            echo "::error::warnings in host/"
            exit 1
          fi

      - name: Build the offline renderer
        run: |
          cmake -S tools/render -B build/render -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/render

      - name: Render and measure every mood
        run: |
          set -euo pipefail
          for m in 0 1 2 3 4 5; do
            ./build/render/nulleig_render "/tmp/mood$m.wav" 45 --mood "$m"
          done
          # The tour walks both axes and every mood transition, which is where
          # a synthesizer usually breaks.
          ./build/render/nulleig_render /tmp/tour.wav 120 --tour

      - name: A piece is still reproducible from its name
        run: |
          set -euo pipefail
          R=./build/render/nulleig_render
          $R /tmp/a.wav 30 --mood 2 --seed 12345 --x 0.62 --y 0.38 > /dev/null
          $R /tmp/b.wav 30 --mood 2 --seed 12345 --x 0.62 --y 0.38 > /dev/null
          if ! cmp -s /tmp/a.wav /tmp/b.wav; then
            echo "::error::the same piece rendered twice is not the same audio"
            exit 1
          fi
          echo "same seed, mood and field -> byte-identical audio"

      - name: The picture still draws
        run: |
          set -euo pipefail
          # Headless, so the composition and the chrome are checked without a
          # display. A blank frame is a real failure mode and an easy one to
          # ship, because nothing crashes.
          SDL_VIDEODRIVER=offscreen ./build/checks/null_eigenvalue \
            --shot 120 /tmp/field.bmp --mood 2 --size 1280 800
          SIZE=$(stat -c%s /tmp/field.bmp)
          echo "frame is $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::the rendered frame is suspiciously small"
            exit 1
          fi

      - name: Keep the audio and the frame for listening and looking
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            /tmp/*.wav
            /tmp/field.bmp
          retention-days: 7

  # ----------------------------------------------------------------- windows
  # Cross-compiled from Linux with MinGW rather than built on a Windows runner.
  # The app links SDL3 and the engine statically and reaches the network
  # through WinHTTP, so there is nothing MSVC-specific left to need; one Linux
  # job is faster and simpler than a second runner image.
  windows:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64

      - name: Build SDL3 for Windows
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/b -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/host/cmake/mingw-w64.cmake \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/w64 \
            -DSDL_STATIC=ON -DSDL_SHARED=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_EXAMPLES=OFF
          cmake --build /tmp/SDL/b
          cmake --install /tmp/SDL/b

      - name: Build
        run: |
          set -euo pipefail
          cmake -S host -B host/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/host/cmake/mingw-w64.cmake \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/tmp/w64 \
            -DNE_VERSION=${{ needs.version.outputs.version }}
          cmake --build host/build --target null_eigenvalue

      - name: Confirm it needs nothing but Windows
        run: |
          set -euo pipefail
          EXE=host/build/null_eigenvalue.exe
          file "$EXE"
          # Anything outside the system set means the installer would have to
          # carry a DLL, which is exactly the wiring that breaks silently.
          BAD=$(x86_64-w64-mingw32-objdump -p "$EXE" | grep "DLL Name" \
            | grep -ivE "ADVAPI32|GDI32|IMM32|KERNEL32|OLEAUT32|SETUPAPI|SHELL32|USER32|VERSION|WINMM|WINHTTP|msvcrt|ole32|CRYPT32|WS2_32|dwmapi|uxtheme" || true)
          if [ -n "$BAD" ]; then
            echo "::error::unexpected DLL dependency"
            echo "$BAD"
            exit 1
          fi

      - name: Build the installer
        run: |
          set -euo pipefail
          sudo apt-get install -y innoextract wine64 || true
          # Inno Setup needs Windows; the runner has wine. If this proves
          # flaky it moves back to a windows-latest job with ISCC.
          curl -fsSL -o /tmp/is.exe https://jrsoftware.org/download.php/is.exe
          wine /tmp/is.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART || true
          ISCC="$HOME/.wine/drive_c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          wine "$ISCC" "/DAppVersion=${{ needs.version.outputs.version }}" \
            windows/installer/null_eigenvalue.iss
          cp windows/installer/NullEigenvalue-Setup.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: NullEigenvalue-Setup.exe
          if-no-files-found: error

  # ------------------------------------------------------------------- macos
  macos:
    runs-on: macos-15
    needs: version
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja

      - name: Build
        run: |
          set -euo pipefail
          cmake -S host -B host/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNE_VERSION=${{ needs.version.outputs.version }}
          cmake --build host/build --target null_eigenvalue

      - name: Package a disk image
        run: |
          set -euo pipefail
          APP="Null Eigenvalue.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp host/build/null_eigenvalue "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Null Eigenvalue</string>
            <key>CFBundleIdentifier</key><string>com.nulleigenvalue.nullEigenvalue</string>
            <key>CFBundleExecutable</key><string>null_eigenvalue</string>
            <key>CFBundleShortVersionString</key><string>${{ needs.version.outputs.version }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          # Ad-hoc, because there are no Apple credentials in this repo and
          # there are not going to be. On Apple silicon an unsigned binary will
          # not launch at all, so "signed by nobody" is the floor.
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --strict "$APP"

          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Null Eigenvalue" -srcfolder "$STAGE" \
            -ov -format UDZO NullEigenvalue.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: NullEigenvalue.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------- linux
  # Deliberately not ubuntu-latest. An AppImage is only as portable as the
  # glibc it was linked against, and building on the newest image would produce
  # one that refuses to start on any distribution older than the runner.
  linux:
    runs-on: ubuntu-22.04
    needs: version
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libgl1-mesa-dev \
            libegl1-mesa-dev libgles2-mesa-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libibus-1.0-dev libdecor-0-dev libsndio-dev

      - name: Build
        run: |
          set -euo pipefail
          cmake -S host -B host/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNE_VERSION=${{ needs.version.outputs.version }}
          cmake --build host/build --target null_eigenvalue

      - name: Package an AppImage
        run: |
          set -euo pipefail
          export ARCH=x86_64
          DIR=NullEigenvalue.AppDir
          mkdir -p "$DIR/usr/bin"
          cp host/build/null_eigenvalue "$DIR/usr/bin/"
          cp host/resources/nulleigenvalue.png "$DIR/nulleigenvalue.png"

          cat > "$DIR/nulleigenvalue.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Null Eigenvalue
          Comment=A generative drone instrument
          Exec=null_eigenvalue
          Icon=nulleigenvalue
          Categories=AudioVideo;Audio;Player;
          Terminal=false
          DESKTOP

          cat > "$DIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/null_eigenvalue" "$@"
          APPRUN
          chmod +x "$DIR/AppRun"

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # --appimage-extract-and-run, because the runner has no FUSE and
          # installing libfuse2 to build a file is a strange thing to do.
          ./appimagetool --appimage-extract-and-run "$DIR" NullEigenvalue-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: NullEigenvalue-x86_64.AppImage
          if-no-files-found: error

  # ----------------------------------------------------------------- release
  release:
    runs-on: ubuntu-latest
    needs: [version, checks, windows, macos, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # Named one at a time rather than fetched wholesale, because a bare
      # download-artifact would also drag in the checks job's preview audio.
      - uses: actions/download-artifact@v4
        with: { name: windows-installer }
      - uses: actions/download-artifact@v4
        with: { name: macos-dmg }
      - uses: actions/download-artifact@v4
        with: { name: linux-appimage }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -lh NullEigenvalue*
          cat > notes.md <<EOF
          Built from \`${GITHUB_SHA:0:7}\`.

          **Windows** — \`NullEigenvalue-Setup.exe\` installs under your own profile, so it
          needs no administrator. SmartScreen will warn about an unknown publisher; the
          installer is not signed and there is no certificate in this repo.

          **macOS** — \`NullEigenvalue.dmg\`. Signed to itself and not notarised, so the
          first launch has to be right-click → Open, or:
          \`xattr -dr com.apple.quarantine "/Applications/Null Eigenvalue.app"\`

          **Linux** — \`NullEigenvalue-x86_64.AppImage\`. \`chmod +x\` it and run it.

          All three check for a newer release themselves and can install it from inside
          the app. Every piece has a name like \`NE1-9STP-RV1G-CR5F\`; paste one in with
          \`V\` to hear exactly what someone else heard.
          EOF
          gh release create "v${V}" \
            NullEigenvalue-Setup.exe \
            NullEigenvalue.dmg \
            NullEigenvalue-x86_64.AppImage \
            --target "$GITHUB_SHA" \
            --title "Null Eigenvalue ${V}" \
            --notes-file notes.md
