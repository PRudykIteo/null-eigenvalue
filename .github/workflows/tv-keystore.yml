# Run once, by hand, to give the sideloaded APK a signature that does not
# change from build to build.
#
# Gradle's debug key is generated per machine, so a fresh CI runner signs every
# release with a different one and Android then refuses to install a new APK
# over the old app. This makes one keystore, commits it, and from then on
# android/app/build.gradle.kts finds it and uses it.
#
# It is not a secret. A sideloaded app has no upload key to protect and no store
# account behind it; what the key is for is continuity, not trust. Keep the
# file - losing it means the next release cannot install over this one either.
name: TV keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to replace one that already exists
        run: |
          set -euo pipefail
          if [ -f android/nulleig-tv.jks ]; then
            echo "::error::android/nulleig-tv.jks already exists. Replacing it \
          would break installing over every build signed with the old one."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make the keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore android/nulleig-tv.jks \
            -storetype JKS \
            -storepass nulleigenvalue \
            -keypass nulleigenvalue \
            -alias nulleig \
            -keyalg RSA -keysize 4096 \
            -validity 36500 \
            -dname "CN=Null Eigenvalue, OU=Sideload, O=Null Eigenvalue, C=PL"
          keytool -list -v -keystore android/nulleig-tv.jks \
            -storepass nulleigenvalue | head -20

      - name: Commit it
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f android/nulleig-tv.jks
          # [skip ci], or committing this starts a build, which cuts a release.
          git commit -m 'TV sideload keystore [skip ci]'
          git push
