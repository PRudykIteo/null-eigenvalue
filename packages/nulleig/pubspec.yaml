name: nulleig
description: "Real-time drone synthesis core for Null Eigenvalue: a C++ engine and its audio device, reached from Dart over FFI."
version: 1.0.0
homepage: https://github.com/doctorspider42/null-eigenvalue
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      # The three desktops. Same two source files, three build systems: CMake
      # for Windows and Linux, and a podspec for macOS.
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
